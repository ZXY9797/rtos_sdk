description: FOC Motor controller (composite device)

compatible: "foc,motor"

include: base.yaml

properties:
  pwm-dev:
    type: phandle
    required: true
    description: PWM timer device reference

  adc-dev:
    type: phandle
    required: true
    description: ADC device reference for current sensing

  pwm-ch-u:
    type: int
    required: true
    description: U-phase PWM channel index (0=Ch1, 1=Ch2, 2=Ch3, 3=Ch4)

  pwm-ch-v:
    type: int
    required: true
    description: V-phase PWM channel index

  pwm-ch-w:
    type: int
    required: true
    description: W-phase PWM channel index

  # 电机物理参数 (工程单位, 整数)
  rs-milliohm:
    type: int
    required: true
    description: Stator resistance in milliohms

  ld-microhenry:
    type: int
    required: true
    description: D-axis inductance in microhenries

  lq-microhenry:
    type: int
    required: true
    description: Q-axis inductance in microhenries

  flux-milliweber:
    type: int
    required: true
    description: Flux linkage in milliwebers

  pole-pairs:
    type: int
    required: true
    description: Motor pole pairs

  # FOC 限制参数
  max-current-ma:
    type: int
    required: true
    description: Maximum phase current in milliamps

  max-voltage-mv:
    type: int
    required: true
    description: Maximum bus voltage in millivolts

  # FOC 控制参数
  pwm-frequency:
    type: int
    required: true
    description: PWM switching frequency in Hz

  current-bandwidth:
    type: int
    required: true
    description: Current loop bandwidth in Hz

  timer-clock-hz:
    type: int
    required: true
    description: Timer input clock before the PWM prescaler

  pwm-prescaler:
    type: int
    required: true
    description: PWM timer prescaler register value

  dead-time-ns:
    type: int
    required: true
    description: Complementary PWM dead time in nanoseconds

  adc-resolution-bits:
    type: int
    required: true

  current-u-channel:
    type: int
    required: true

  current-w-channel:
    type: int
    required: true

  vbus-channel:
    type: int
    required: true

  adc-trigger-source:
    type: int
    required: true

  adc-reference-mv:
    type: int
    required: true

  current-zero-code:
    type: int
    required: true

  current-sense-uv-per-amp:
    type: int
    required: true

  vbus-divider-milli:
    type: int
    required: true

  # 模式选择
  sensor-mode:
    type: int
    required: true
    description: >
      Sensor mode: 0=Sensorless, 1=Hall, 2=OpenLoop, 3=Encoder

  control-mode:
    type: int
    required: true
    description: >
      Control mode: 0=Torque, 1=Speed, 2=Duty, 3=Position

cxx-driver:
  adapter:
    header: device_adapters/foc_motor_dt.h
    macro: HAL_FOC_MOTOR_DT_ADAPT
  type-name: foc::MotorDevice
  init: true
  readiness: is-initialized
  requires:
    - phandle: pwm-dev
    - phandle: adc-dev
  init-level: application
  init-priority: 80
