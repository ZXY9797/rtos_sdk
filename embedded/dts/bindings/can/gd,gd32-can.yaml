description: GD32 CAN controller

compatible: "gd,gd32-can"

include: [can-controller.yaml, base.yaml, pinctrl-device.yaml]

cxx-driver:
  adapter:
    header: device_adapters/can_dt.h
    macro: HAL_CAN_DT_ADAPT
  type-name: CanDriver
  init: true
  readiness: is-initialized
  init-level: pre-kernel-2
  init-priority: 25

properties:
  reg:
    type: array
    required: true

  port:
    type: int
    required: true
    description: Zero-based GD32 CAN controller index

  interrupts:
    type: array
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  bitrate:
    type: int
    default: 500000

  label:
    type: string
    required: true
