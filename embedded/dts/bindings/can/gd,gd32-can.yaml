description: GD32 CAN controller

compatible: "gd,gd32-can"

include: [can-fd-controller.yaml, pinctrl-device.yaml]

cxx-driver:
  kconfig: CAN_GD32
  capabilities: [read, write]
  capabilities-if:
    can-fd: fd-enabled
  adapter:
    header: device_adapters/can_dt.h
    macro: HAL_CAN_DT_ADAPT
  type-name: CanDriver
  init: true
  readiness: is-initialized
  init-level: pre-kernel-2
  init-priority: 25

properties:
  reg:
    type: array
    required: true

  port:
    type: int
    required: true
    description: Zero-based GD32 CAN controller index

  interrupts:
    type: array
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  bitrate:
    type: int
    default: 500000

  fd-enabled:
    type: boolean
    description: Enable ISO CAN FD framing on this controller.

  tdc-offset:
    type: int
    default: 0
    description: Secondary sample point offset in CAN clock periods. Zero disables TDC.

  label:
    type: string
    required: true
