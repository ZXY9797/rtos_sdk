description: STM32H7 series FDCAN CAN FD controller

compatible: "st,stm32h7-fdcan"

include: ["bosch,m_can-base.yaml", "pinctrl-device.yaml"]

cxx-driver:
  adapter:
    header: device_adapters/can_dt.h
    macro: HAL_CAN_DT_ADAPT
  type-name: CanDriver
  init: true
  readiness: is-initialized
  init-level: pre-kernel-2
  init-priority: 25

properties:
  port:
    type: int
    required: true
    description: Zero-based STM32 FDCAN controller index

  clocks:
    required: true

  reg:
    required: true

  interrupts:
    required: true

  interrupt-names:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clk-divider:
    type: int
    enum:
      - 1
    description: |
      Only the reset divider of 1 is supported. Other shared FDCAN CCU
      dividers are rejected instead of being silently ignored.
