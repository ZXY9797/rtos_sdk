description: GD32 ADC controller

compatible: "gd,gd32-adc"

include: gd32-adc-common.yaml

cxx-driver:
  kconfig: ADC_GD32
  adapter:
    header: device_adapters/adc_dt.h
    macro: HAL_ADC_DT_ADAPT
  type-name: Adc
  init: true
  interrupts:
    - name: global
      method: isr_global
      uses-osal: true
      enable-on-init: true
  readiness: is-initialized
  init-level: pre-kernel-2
  init-priority: 30
