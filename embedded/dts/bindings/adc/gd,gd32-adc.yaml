description: GD32 ADC controller

compatible: "gd,gd32-adc"

include: [adc-controller.yaml, base.yaml, pinctrl-device.yaml]

cxx-driver:
  adapter:
    header: device_adapters/adc_dt.h
    macro: HAL_ADC_DT_ADAPT
  type-name: Adc
  init: true
  readiness: is-initialized
  init-level: pre-kernel-2
  init-priority: 30

properties:
  reg:
    type: array
    required: true

  interrupts:
    type: array
    required: true

  resolution:
    type: int
    default: 12
    enum: [6, 8, 10, 12]

  label:
    type: string
    required: true
