# SPDX-License-Identifier: Apache-2.0

description: |
  GPIO-connected keys or buttons.

  Each key is defined in a child node of the gpio-keys node. The child node
  exposes a single GPIO as a generated C++ GpioPort device, matching the
  gpio-leds style used by board demos.

compatible: "gpio-keys"

child-binding:
  description: GPIO key child node

  include:
    - name: pinctrl-device.yaml

  properties:
    gpios:
      type: phandle-array
      required: true

    label:
      type: string

cxx-driver:
  adapter:
    header: device_adapters/gpio_dt.h
    macro: HAL_GPIO_DT_ADAPT
  type-name: GpioPort
  scope: children
  readiness: always-ready
  requires:
    - phandle-array: gpios
      lifecycle: external
