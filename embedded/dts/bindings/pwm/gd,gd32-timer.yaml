description: GD32 TIMER (PWM) controller

compatible: "gd,gd32-timer"

include: [pwm-controller.yaml, base.yaml, pinctrl-device.yaml]

cxx-driver:
  adapter:
    header: device_adapters/pwm_dt.h
    macro: HAL_GD32_PWM_DT_ADAPT
  type-name: Pwm
  init: true
  interrupts:
    - name: update
      method: isr_update
      uses-osal: true
  readiness: is-initialized
  init-level: pre-kernel-2
  init-priority: 25

properties:
  reg:
    type: array
    required: true

  interrupts:
    type: array
    required: true

  label:
    type: string
    required: true

  channel:
    type: int
    required: true
    description: PWM channel index (0=Ch1, 1=Ch2, 2=Ch3, 3=Ch4)

  prescaler:
    type: int
    default: 0
    description: PWM timer prescaler value

  period:
    type: int
    default: 0
    description: PWM timer period value

  "#pwm-cells":
    const: 3

pwm-cells:
  - channel
  - period
  - flags
