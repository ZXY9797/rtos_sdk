description: GD32 USART

compatible: "gd,gd32-usart"

include: [uart-controller.yaml, base.yaml, pinctrl-device.yaml]

cxx-driver:
  adapter:
    header: device_adapters/uart_dt.h
    macro: HAL_GD32_UART_DT_ADAPT
  type-name: Uart
  init: true
  interrupts:
    - name: global
      method: isr_global
      uses-osal: true
      enable-on-init: true
    - name: dma-tx
      method: isr_dma_tx
      uses-osal: true
      enable-on-init: true
      source:
        phandle-array: dmas
        entry: tx
        interrupt-index-cell: channel
  requires:
    - phandle-array: dmas
  readiness: device-base
  device-base: true
  init-level: post-kernel
  # Default PRE_KERNEL_2 initcall priority for GD32 USART instances.
  # A board DTS node may override this with:
  #   init-priority = <N>;
  # Lower values run earlier within the same init level.
  init-priority: 25

properties:
  reg:
    type: array
    required: true

  interrupts:
    type: array
    required: true

  current-speed:
    type: int
    default: 115200

  label:
    type: string
    required: true
