description: Goodix GR5525 UART

compatible: "goodix,gr5525-uart"

include: [uart-controller.yaml, base.yaml]

cxx-driver:
  adapter:
    header: device_adapters/uart_dt.h
    macro: HAL_UART_DT_ADAPT
  type-name: Uart
  init: true
  interrupts:
    - name: global
      method: isr_global
      uses-osal: true
  readiness: device-base
  device-base: true
  init-level: post-kernel
  init-priority: 25

properties:
  reg:
    type: array
    required: true

  interrupts:
    type: array
    required: true

  current-speed:
    type: int
    default: 115200

  label:
    type: string
    required: true
