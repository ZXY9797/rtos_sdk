description: STM32 LPUART

compatible: "st,stm32-lpuart"

include: st,stm32-uart-base.yaml

cxx-driver:
  adapter:
    header: device_adapters/uart_dt.h
    macro: HAL_UART_DT_ADAPT
  type-name: Uart
  init: true
  isr: true
  readiness: device-base
  device-base: true
  init-level: pre-kernel-2
  init-priority: 25
