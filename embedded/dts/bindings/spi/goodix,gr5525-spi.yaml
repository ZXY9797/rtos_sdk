description: Goodix GR5525 SPI (DesignWare SSI compatible)

compatible: "goodix,gr5525-spi"

include: [spi-controller.yaml, base.yaml]

cxx-driver:
  adapter:
    header: device_adapters/spi_dt.h
    macro: HAL_SPI_DT_ADAPT
  type-name: Spi
  init: true
  readiness: device-base
  device-base: true
  init-level: pre-kernel-2
  init-priority: 25

properties:
  reg:
    type: array
    required: true

  interrupts:
    type: array
    required: true

  spi-max-frequency:
    type: int
    default: 1000000

  label:
    type: string
    required: true
