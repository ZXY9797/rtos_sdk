description: STM32 SPI controller

compatible: "st,stm32-spi"

include: st,stm32-spi-common.yaml

cxx-driver:
  adapter:
    header: device_adapters/spi_dt.h
    macro: HAL_SPI_DT_ADAPT
  type-name: Spi
  init: true
  interrupts:
    - name: global
      method: isr_global
      uses-osal: true
      enable-on-init: true
  readiness: device-base
  device-base: true
  init-level: pre-kernel-2
  init-priority: 25
