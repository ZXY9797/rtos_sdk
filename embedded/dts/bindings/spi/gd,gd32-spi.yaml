description: GD32 SPI controller

compatible: "gd,gd32-spi"

include: [spi-controller.yaml, base.yaml, pinctrl-device.yaml]

cxx-driver:
  adapter:
    header: device_adapters/spi_dt.h
    macro: HAL_GD32_SPI_DT_ADAPT
  type-name: Spi
  init: true
  interrupts:
    - name: dma-tx
      method: isr_dma_tx
      uses-osal: true
      enable-on-init: true
      source:
        phandle-array: dmas
        entry: tx
        interrupt-index-cell: channel
    - name: dma-rx
      method: isr_dma_rx
      uses-osal: true
      enable-on-init: true
      source:
        phandle-array: dmas
        entry: rx
        interrupt-index-cell: channel
  requires:
    - phandle-array: dmas
      lifecycle: external
  readiness: device-base
  device-base: true
  # GD32 SPI is a low-level bus/HAL driver. Clients that transfer during
  # initialization must run post-kernel because transfers use OSAL primitives.
  init-level: pre-kernel-2
  # Default PRE_KERNEL_2 initcall priority for GD32 SPI instances.
  # A board DTS node may override this with:
  #   init-priority = <N>;
  # Lower values run earlier within the same init level.
  init-priority: 25

properties:
  reg:
    type: array
    required: true

  spi-max-frequency:
    type: int
    default: 1000000

  label:
    type: string
    required: true
