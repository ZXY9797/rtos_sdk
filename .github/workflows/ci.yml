name: SDK CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  windows-host-contracts:
    name: Windows host contracts
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install Python build dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Run the Windows host suite
        run: python tools/sdk.py test --suite host -B out/checks --generator "Visual Studio 17 2022"
      - name: Retain test results and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-host-results
          path: |
            out/checks/test-results.json
            out/checks/host/ctest.xml
            out/checks/host/Testing/Temporary/LastTest.log
            out/checks/**/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

  host-contracts:
    name: Host contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out sources
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r tools/requirements-ci.txt

      - name: Run the Linux host suite
        run: python tools/sdk.py test --suite host -B out/checks
      - name: Retain test results and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-host-results
          path: |
            out/checks/test-results.json
            out/checks/host/ctest.xml
            out/checks/host/Testing/Temporary/LastTest.log
            out/checks/**/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

  firmware-contracts:
    name: Firmware contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARMGCC9_VERSION: 9.3.1-1.4
      ARMGCC9_ARCHIVE_SHA256: >-
        720dd38a6abadc0286f2b3c8dbc7239c7dbfdd64bc052345d149657e5478b914
    steps:
      - name: Check out sources
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r tools/requirements-ci.txt

      - name: Install ARM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi ninja-build
          arm-none-eabi-gcc --version
          cmake --version
          ninja --version

      - name: Install locked Goodix ARM GCC
        run: |
          archive_name="xpack-arm-none-eabi-gcc-${ARMGCC9_VERSION}"
          archive_name="${archive_name}-linux-x64.tar.gz"
          archive="${RUNNER_TEMP}/${archive_name}"
          root="${GITHUB_WORKSPACE}/out/toolchains/gcc-9.3.1"
          toolchain="${root}/xpack-arm-none-eabi-gcc-${ARMGCC9_VERSION}"
          release_url="https://github.com/xpack-dev-tools"
          release_url="${release_url}/arm-none-eabi-gcc-xpack"
          release_url="${release_url}/releases/download"
          url="${release_url}/v${ARMGCC9_VERSION}/${archive_name}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${archive}" "${url}"
          checksum="${ARMGCC9_ARCHIVE_SHA256}"
          checksum="${checksum}  ${archive}"
          sha256sum --check --strict <<< "${checksum}"
          mkdir -p "${root}"
          tar -xzf "${archive}" -C "${root}"
          test "$("${toolchain}/bin/arm-none-eabi-gcc" \
            -dumpfullversion -dumpversion)" = "9.3.1"
          "${toolchain}/bin/arm-none-eabi-gcc" --version
          echo "ARMGCC9_TOOLCHAIN_PATH=${toolchain}" >> "${GITHUB_ENV}"

      - name: Run configuration policies, port and external app contracts
        run: python tools/sdk.py test --suite contracts -B out/contracts

      - name: Build firmware configurations and check resource budgets
        run: |
          mkdir -p out
          python tools/sdk.py test --suite firmware -B out/architecture-matrix 2>&1 | tee out/firmware-checks.log

      - name: Build and verify all factory images
        run: python tools/scripts/check_factory_images.py -B out/architecture-matrix 2>&1 | tee out/factory-checks.log

      - name: Summarize firmware resources and factory checksums
        if: ${{ !cancelled() }}
        run: |
          if [[ -f out/architecture-matrix/resource-summary.md ]]; then
            cat out/architecture-matrix/resource-summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -f out/architecture-matrix/factory/SHA256SUMS ]]; then
            {
              echo "### Factory image SHA-256"
              echo '```text'
              cat out/architecture-matrix/factory/SHA256SUMS
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Retain firmware test and configuration evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: firmware-contract-results
          path: |
            out/firmware-checks.log
            out/factory-checks.log
            out/contracts/test-results.json
            out/contracts/**/*.log
            out/contracts/**/report.json
            out/architecture-matrix/test-results.json
            out/architecture-matrix/resource-summary.md
            out/architecture-matrix/*/*.resources.json
            out/architecture-matrix/**/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload development firmware outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: development-firmware-${{ github.sha }}
          include-hidden-files: true
          path: |
            out/architecture-matrix/osal-freertos/.config
            out/architecture-matrix/osal-freertos/build-info.json
            out/architecture-matrix/osal-rtthread/.config
            out/architecture-matrix/osal-rtthread/build-info.json
            out/architecture-matrix/*/*.bin
            out/architecture-matrix/*/*.elf
            out/architecture-matrix/*/*.elf_origin
            out/architecture-matrix/*/*.hex
            out/architecture-matrix/*/*.map
            out/architecture-matrix/*/*.manifest.json
            out/architecture-matrix/*/*.architecture.md
            out/architecture-matrix/*/*.devices.dot
            out/architecture-matrix/*/include/generated/devices.json
            out/architecture-matrix/factory/*/*.bin
            out/architecture-matrix/factory/*/*.img
            out/architecture-matrix/factory/*/*/*.bin
            out/architecture-matrix/factory/*/*/*.elf
            out/architecture-matrix/factory/*/*/*.manifest.json
            out/architecture-matrix/factory/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
