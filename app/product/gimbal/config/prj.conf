CONFIG_RTOS_FREERTOS=y
CONFIG_FREERTOS_HEAP_SIZE=8192
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SOC_SERIES_GD32F50X=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=200000000
CONFIG_PINCTRL=y
CONFIG_UART_GD32=y
CONFIG_SPI=y
CONFIG_SPI_GD32=y
CONFIG_DMA_GD32=y
CONFIG_XIP=y

CONFIG_PWM=y
CONFIG_PWM_GD32=y
CONFIG_ADC=y
CONFIG_ADC_GD32=y
CONFIG_FLASH_GD32=y
CONFIG_NVS=y
CONFIG_IMU_ICM40609D=y

CONFIG_APP_PRODUCTION=y
CONFIG_APP_WATCHDOG_TIMEOUT_MS=5000
CONFIG_APP_WATCHDOG_CHECK_MS=100
CONFIG_APP_WATCHDOG_STACK_SIZE=768

CONFIG_GIMBAL=y
CONFIG_GIMBAL_MOTOR_VOLTAGE_FOC=y
CONFIG_GIMBAL_SENSOR_HZ=16000
CONFIG_GIMBAL_CONTROL_HZ=1000
CONFIG_GIMBAL_PHASE_CURRENT_SENSE=n
CONFIG_GIMBAL_VBUS_SENSE=n
CONFIG_GIMBAL_DRIVER_TEMP_SENSE=n
CONFIG_GIMBAL_MOS_TEMP_SENSE=n
