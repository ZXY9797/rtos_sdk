CONFIG_RTOS_FREERTOS=y
CONFIG_SOC_SERIES_GD32F50X=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=200000000
CONFIG_PINCTRL=y
CONFIG_UART_GD32=y
CONFIG_DMA_GD32=y
CONFIG_XIP=y

# FOC Motor Control
CONFIG_PWM=y
CONFIG_PWM_GD32=y
CONFIG_ADC=y
CONFIG_ADC_GD32=y

# CAN
CONFIG_CAN=y
CONFIG_CAN_GD32=y

# Flash + NVS
CONFIG_FLASH_GD32=y
CONFIG_NVS=y


# Link: one UART endpoint with a bounded product-sized runtime footprint.
CONFIG_LINK=y
CONFIG_LINK_MAX_FRAME_SIZE=512
CONFIG_LINK_MAX_LINKS=2
CONFIG_LINK_MAX_ROUTES=2
CONFIG_LINK_MAX_PENDING=4
CONFIG_LINK_ACK_NOW_TIMEOUT_MS=50
CONFIG_LINK_ACK_NOW_RETRIES=2
CONFIG_LINK_MAX_LOCAL_ADDRESSES=2
CONFIG_LINK_WORK_QUEUE_DEPTH=2
CONFIG_LINK_MAX_ASYNC_REQUESTS=2
CONFIG_LINK_REPLAY_CACHE_SIZE=16
CONFIG_LINK_REPLAY_RESPONSE_SIZE=496
CONFIG_LINK_WORKER_STACK=3072
CONFIG_LINK_UART_TX_TIMEOUT_MS=5
CONFIG_NVS_SECTOR_COUNT=4
CONFIG_LOG_THREAD_STACK_SIZE=1536
# Initialization validates complete control/model configurations before IRQs start.
CONFIG_MAIN_STACK_SIZE=8192
