description: Product FOC acquisition and PWM timing
compatible: "rtos_sdk,md007-control"
include: base.yaml
properties:
  current-channels:
    type: array
    required: true
  joint-channels:
    type: array
    required: true
  temperature-channels:
    type: array
    required: true
  timer-clock-hz:
    type: int
    required: true
  pwm-frequency-hz:
    type: int
    required: true
  adc-before-peak-ns:
    type: int
    required: true
  current-triggers:
    type: phandle-array
    specifier-space: trigger
    required: true
  joint-triggers:
    type: phandle-array
    specifier-space: trigger
    required: true
  brake-enable-gpios:
    type: phandle-array
    description: Brake power supply enable.
  brake-voltage-select-gpios:
    type: phandle-array
    description: Brake power supply voltage selection.
