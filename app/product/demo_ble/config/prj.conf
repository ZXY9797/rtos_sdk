CONFIG_RTOS_FREERTOS=y
CONFIG_FREERTOS_HEAP_SIZE=16384
CONFIG_SOC_SERIES_GR5525X=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=96000000
CONFIG_UART_GR5525=y
CONFIG_GPIO_GR5525=y
CONFIG_BLE_GR5525=y
CONFIG_BLE_HID=y
CONFIG_BLE_UART_SERVICE=y
CONFIG_BLE_BATTERY_SERVICE=y
CONFIG_BLE_DEVICE_INFO=y
CONFIG_BLE_TASK_STACK_SIZE=2048
CONFIG_BLE_EVENT_QUEUE_DEPTH=8
CONFIG_BLE_MAX_CONNECTIONS=1
CONFIG_BLE_MAX_ADVS=1
CONFIG_BLE_MAX_SCAN=0
CONFIG_BLE_MAX_BOND_DEVS=1
CONFIG_BLE_MAX_PRFS=8
CONFIG_BLE_CONTROLLER_ONLY=n
CONFIG_BLE_CONNLESS_AOA_AOD=n
CONFIG_GR5525_BOOT_CHECK_IMAGE=y
CONFIG_GR5525_BOOT_LONG_TIME=n
CONFIG_GR5525_SECURITY_CFG=0
CONFIG_MAIN_STACK_SIZE=2048

# Link: one BLE endpoint; diagnostics v1 with one link fits in 128 bytes.
CONFIG_LINK=y
CONFIG_LINK_MAX_FRAME_SIZE=512
CONFIG_LINK_MAX_LINKS=1
CONFIG_LINK_MAX_ROUTES=2
CONFIG_LINK_MAX_PENDING=4
CONFIG_LINK_ACK_NOW_TIMEOUT_MS=50
CONFIG_LINK_ACK_NOW_RETRIES=2
CONFIG_LINK_MAX_LOCAL_ADDRESSES=2
CONFIG_LINK_WORK_QUEUE_DEPTH=2
CONFIG_LINK_MAX_ASYNC_REQUESTS=2
CONFIG_LINK_REPLAY_CACHE_SIZE=16
CONFIG_LINK_REPLAY_RESPONSE_SIZE=128
CONFIG_LINK_WORKER_STACK=3072
